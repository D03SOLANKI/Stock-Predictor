name: NSE 8:45 AM Pre-Market Scan & Paper Trader

on:
  schedule:
    # 03:15 UTC = 08:45 AM IST (Monday through Friday)
    - cron: '15 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  premarket_scan:
    name: Run Pre-Market Top Gainer Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 8:45 AM Pre-Market Scan
        run: |
          python scan_premarket_top_gainers.py --top-n 3 --capital 100000 --risk 2.0 --bypass-regime

      - name: Commit & Push Generated Intelligence Reports & Paper Signal
        run: |
          git config --global user.name "NSE Auto-Trader Bot"
          git config --global user.email "bot@dalalstreet-quant.local"
          git add results/premarket_reports/*.md scratch/*.json || true
          git diff-index --quiet HEAD || git commit -m "auto: 8:45 AM Pre-market intelligence scan report [skip ci]"
          git push || true

      - name: Upload Premarket Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: premarket-intelligence-reports
          path: results/premarket_reports/
